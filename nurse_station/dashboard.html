<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Nurse Station Dashboard Templates &amp; Styles</title>

  <!-- ==========================================================================
     1. GLOBAL STYLESHEET  (Manrope for UI, IBM Plex Mono for numbers)
     ========================================================================== -->
  <style id="bento-styles">
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200');

    :root {
      --bg: #0a0e13;
      --sidebar-bg: #0d1218;
      --card: #111720;
      --card-2: #0c1117;
      --border: rgba(255, 255, 255, 0.07);
      --text: #eef2f6;
      --muted: #8a96a6;
      --dim: #5d6877;
      --green: #34d399;
      --amber: #fbbf24;
      --red: #f87171;
      --blue: #60a5fa;
      --ui: 'Manrope', -apple-system, 'Segoe UI', sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    }

    header,
    footer,
    #MainMenu {
      display: none !important;
    }

    .stApp {
      font-family: var(--ui);
      background-color: var(--bg) !important;
      color: var(--text) !important;
    }

    /* Prevent custom fonts from overriding Streamlit icon ligatures */
    span[class*="e1vmumty"],
    span[data-testid*="Icon"],
    span[data-testid*="icon"],
    [data-testid="stIcon"],
    [data-testid="stExpanderToggleIcon"],
    [data-testid="stExpanderToggleIcon"] *,
    [class*="material-symbols"],
    [class*="material-icons"],
    .material-symbols-rounded,
    .material-icons,
    [data-testid="stExpander"] summary span svg {
      font-family: "Material Symbols Rounded", "Material Icons" !important;
      font-weight: normal !important;
      font-style: normal !important;
      line-height: 1 !important;
      letter-spacing: normal !important;
      text-transform: none !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      white-space: nowrap !important;
      word-wrap: normal !important;
      direction: ltr !important;
      font-feature-settings: 'liga' 1 !important;
      -webkit-font-feature-settings: 'liga' 1 !important;
      -webkit-font-smoothing: antialiased !important;
    }

    /* Streamlit Expander header & content styling */
    [data-testid="stExpander"] {
      background: var(--card) !important;
      border: 1px solid var(--border) !important;
      border-radius: 12px !important;
      margin-bottom: 8px !important;
      overflow: hidden !important;
    }

    [data-testid="stExpander"] details {
      border: none !important;
      background: transparent !important;
    }

    [data-testid="stExpander"] summary {
      padding: 10px 12px !important;
      cursor: pointer !important;
    }

    [data-testid="stExpander"] summary p {
      font-family: var(--ui) !important;
      font-size: 13px !important;
      font-weight: 700 !important;
      color: #f1f5f9 !important;
      margin: 0 !important;
    }

    [data-testid="stExpander"] [data-testid="stExpanderDetails"] {
      padding: 8px 12px 12px 12px !important;
      border-top: 1px solid var(--border) !important;
    }

    code,
    .mono {
      font-family: var(--mono) !important;
    }

    [data-testid="stSidebar"] {
      background-color: var(--sidebar-bg) !important;
      border-right: 1px solid var(--border) !important;
      padding-top: 1rem !important;
    }

    .block-container {
      padding-top: 1.4rem !important;
      padding-bottom: 2rem !important;
      max-width: 1360px !important;
    }

    /* ---------- Header ---------- */
    .topbar {
      padding: 4px 0 6px 0;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
    }

    .meta {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 500;
    }

    .sec-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--dim);
      margin: 22px 0 12px 0;
    }

    /* ---------- Bento ---------- */
    .ward-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
      margin-bottom: 8px;
    }

    .patient-name {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .patient-diagnosis {
      font-size: 11px;
      color: var(--muted);
      margin: 4px 0 10px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .ward-vitals-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 10px;
      margin-bottom: 8px;
    }

    .vital-mini {
      display: flex;
      flex-direction: column;
    }

    .vital-mini .lbl {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--dim);
    }

    .vital-mini .val-sm {
      font-size: 13.5px;
      font-weight: 700;
      font-family: var(--mono);
      line-height: 1.2;
      margin-top: 2px;
    }

    .inspect-btn {
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(96, 165, 250, 0.09);
      border: 1px solid rgba(96, 165, 250, 0.25);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .inspect-btn:hover {
      background: rgba(96, 165, 250, 0.22);
      border-color: var(--blue);
      color: #fff;
    }

    .ward-rect-card {
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .ward-rect-card:hover {
      border-color: rgba(96, 165, 250, 0.45) !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .ward-card-selected {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 1px #3b82f6, 0 8px 24px rgba(59, 130, 246, 0.22) !important;
    }

    /* ---------- Blinking Red Emergency Alert Pop-up ---------- */
    @keyframes emergency-pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.95), 0 12px 36px rgba(0, 0, 0, 0.8);
        border-color: #ef4444;
        background-color: rgba(69, 10, 10, 0.96);
      }
      50% {
        box-shadow: 0 0 0 16px rgba(239, 68, 68, 0), 0 16px 45px rgba(239, 68, 68, 0.6);
        border-color: #fca5a5;
        background-color: rgba(153, 27, 27, 0.98);
      }
    }

    @keyframes emergency-badge-flash {
      0%, 100% {
        background-color: #ef4444;
        color: #ffffff;
      }
      50% {
        background-color: #7f1d1d;
        color: #fecaca;
      }
    }

    @keyframes emergency-text-flash {
      0%, 100% {
        opacity: 1;
        color: #fee2e2;
      }
      50% {
        opacity: 0.45;
        color: #fca5a5;
      }
    }

    @keyframes emergency-dot-blink {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.4);
        opacity: 0.35;
      }
    }

    .emergency-toast-container {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 440px;
      width: calc(100vw - 56px);
      pointer-events: auto;
    }

    .emergency-popup {
      display: block;
      text-decoration: none !important;
      color: #ffffff !important;
      border: 2px solid #ef4444;
      border-radius: 16px;
      padding: 16px 18px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: emergency-pulse 1.0s infinite ease-in-out;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      box-sizing: border-box;
    }

    .emergency-popup:hover {
      transform: scale(1.02);
      filter: brightness(1.1);
    }

    .emergency-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      animation: emergency-badge-flash 0.8s infinite;
    }

    .emergency-pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      display: inline-block;
      animation: emergency-dot-blink 0.8s infinite;
    }

    .emergency-reason {
      font-size: 13px;
      font-weight: 800;
      margin: 8px 0 6px 0;
      animation: emergency-text-flash 1.0s infinite;
      letter-spacing: -0.01em;
    }

    .emergency-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px 12px;
      margin-top: 10px;
      background: #ef4444;
      color: #ffffff !important;
      font-weight: 800;
      font-size: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-decoration: none !important;
      letter-spacing: 0.02em;
      transition: background 0.15s ease;
    }

    .emergency-popup:hover .emergency-action-btn {
      background: #dc2626;
    }

    .bento {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }

    .tile {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .span-4 {
      grid-column: span 4;
    }

    .span-6 {
      grid-column: span 6;
    }

    .span-8 {
      grid-column: span 8;
    }

    .span-12 {
      grid-column: span 12;
    }

    @media (max-width: 1000px) {

      .span-4,
      .span-6,
      .span-8 {
        grid-column: span 12;
      }
    }

    .bed-id {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .room-sub {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .lbl {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .sub {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .val-xl {
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -0.03em;
      font-family: var(--mono);
    }

    .val-lg {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-family: var(--mono);
      line-height: 1;
    }

    .val-md {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .val-sm {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      font-family: var(--mono);
      letter-spacing: -0.02em;
    }

    .val-xs {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .unit {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      font-family: var(--ui);
      margin-left: 2px;
    }

    .row-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .ward-vitals {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .pill {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .pill-green {
      background: rgba(52, 211, 153, 0.12);
      color: var(--green);
    }

    .pill-amber {
      background: rgba(251, 191, 36, 0.12);
      color: var(--amber);
    }

    .pill-red {
      background: rgba(248, 113, 113, 0.14);
      color: var(--red);
    }

    .pill-blue {
      background: rgba(96, 165, 250, 0.14);
      color: var(--blue);
    }

    .pill-muted {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
    }

    .bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 3px;
      overflow: hidden;
      margin: 14px 0 0 0;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
    }

    .trust-dots {
      display: flex;
      gap: 14px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .trust-dots span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    .legend {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .kv-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .kv {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .kv:last-child {
      border-bottom: none;
    }

    .kv span:first-child {
      color: var(--muted);
    }

    .kv span:last-child {
      font-family: var(--mono);
      font-weight: 500;
    }

    .log-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 160px;
      overflow-y: auto;
    }

    .log-row {
      font-size: 12px;
      color: #cbd5e1;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
    }

    /* Hover info bubble */
    .info {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      margin-left: 6px;
      border-radius: 50%;
      font-size: 9px;
      font-weight: 700;
      color: var(--dim);
      border: 1px solid var(--border);
      cursor: help;
      vertical-align: middle;
      text-transform: none;
      letter-spacing: 0;
    }

    .info:hover {
      color: var(--blue);
      border-color: var(--blue);
    }

    .info .tip {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      left: 0;
      bottom: calc(100% + 8px);
      width: 220px;
      background: #1a2230;
      color: #e6ebf2;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.45;
      pointer-events: none;
      z-index: 50;
      transition: opacity .15s;
      text-transform: none;
      letter-spacing: 0;
    }

    .info:hover .tip {
      visibility: visible;
      opacity: 1;
    }

    /* Sidebar */
    .room-header {
      font-size: 13px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
    }

    .device-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>

<body>

  <!-- ==========================================================================
     1.5 EMERGENCY BLINKING POP-UP CARD
     ========================================================================== -->
  <template id="emergency_popup_card">
    <a href="?bed={{pid}}&view=detail&dept={{dept}}" target="_self" class="emergency-popup">
      <div class="row-between" style="align-items:center; margin-bottom:6px;">
        <span class="emergency-badge">
          <span class="emergency-pulse-dot"></span>
          CRITICAL EMERGENCY ALERT
        </span>
        <span style="font-size:12px; font-weight:700; color:#fee2e2; font-family:'IBM Plex Mono',monospace;">
          {{room}}
        </span>
      </div>

      <div style="margin:8px 0 6px 0;">
        <div style="font-size:16px; font-weight:800; color:#ffffff; line-height:1.25;">{{patient_name}}</div>
        <div style="font-size:11.5px; color:#fecaca; margin-top:2px;">
          <span style="font-weight:700; color:#fff;">{{pid}}</span> &middot; {{diagnosis}}
        </div>
      </div>

      <div class="emergency-reason">{{reason}}</div>

      <div style="font-size:11.5px; color:#fee2e2; font-family:'IBM Plex Mono',monospace; background:rgba(0,0,0,0.35); padding:6px 10px; border-radius:8px; border:1px solid rgba(239,68,68,0.4); margin-bottom:8px;">
        HR {{hr_v}} bpm &middot; SpO2 {{sp_v}}% &middot; EtCO2 {{co2_v}} &middot; BP {{bp_v}}
      </div>

      <div class="emergency-action-btn">
        RESPOND TO EMERGENCY &mdash; OPEN {{pid}} DASHBOARD &rarr;
      </div>
    </a>
  </template>


  <!-- ==========================================================================
     2. TOPBAR
     ========================================================================== -->
  <template id="topbar">
    <div class="topbar">
      <div class="title">ICU Nurse Station</div>
      <div class="meta">{{bed_count}} patients monitored</div>
    </div>
  </template>


  <!-- ==========================================================================
     3. WARD OVERVIEW CARD (one per bed)
     ========================================================================== -->
  <template id="ward_tile">
    <a href="?bed={{pid}}&view=detail&dept={{dept}}" target="_self" class="tile ward-rect-card {{selected_cls}}" style="border-color:{{border_col}}; text-decoration:none; color:inherit; display:flex;">
      <div class="row-between" style="align-items:flex-start; margin-bottom:4px;">
        <div>
          <div class="patient-name">{{patient_name}}</div>
          <div class="sub" style="margin-top:2px;">
            <span class="bed-id" style="font-size:13px; color:var(--text); font-weight:700;">{{pid}}</span> &middot; <span class="room-sub">{{room_short}}</span>
          </div>
        </div>
        <span class="pill {{pill_cls}}">{{label}}</span>
      </div>

      <div class="patient-diagnosis">{{diagnosis}}</div>

      <div class="ward-vitals-grid">
        <div class="vital-mini">
          <div class="lbl">Heart rate</div>
          <div class="val-sm" style="color:var(--blue);">{{hr_txt}} <span class="unit">bpm</span></div>
        </div>
        <div class="vital-mini">
          <div class="lbl">SpO2</div>
          <div class="val-sm" style="color:var(--green);">{{sp_txt}}</div>
        </div>
        <div class="vital-mini">
          <div class="lbl">EtCO2</div>
          <div class="val-sm" style="color:var(--amber);">{{co2_txt}} <span class="unit">mmHg</span></div>
        </div>
        <div class="vital-mini">
          <div class="lbl">Invasive BP</div>
          <div class="val-sm" style="color:#f472b6;">{{ibp_txt}} <span class="unit">mmHg</span></div>
        </div>
        <div class="vital-mini">
          <div class="lbl">Cuff NIBP</div>
          <div class="val-sm" style="color:#a78bfa;">{{nibp_txt}} <span class="unit">mmHg</span></div>
        </div>
      </div>

      <div style="margin:8px 0 10px 0;">{{ecg_svg}}</div>

      <div class="row-between" style="border-top:1px solid rgba(255,255,255,0.06); padding-top:10px; margin-top:4px;">
        <div class="trust-dots">
          <span><i class="dot" style="background:{{ecg_dot}}"></i>ECG</span>
          <span><i class="dot" style="background:{{spo2_dot}}"></i>SpO2</span>
          <span><i class="dot" style="background:{{hr_dot}}"></i>HR</span>
          <span><i class="dot" style="background:{{co2_dot}}"></i>CO2</span>
          <span><i class="dot" style="background:{{ibp_dot}}"></i>IBP</span>
          <span><i class="dot" style="background:{{nibp_dot}}"></i>NIBP</span>
        </div>
        <span class="inspect-btn">
          View Bed Dashboard &rarr;
        </span>
      </div>
    </a>
  </template>


  <!-- ==========================================================================
     4. SENSOR TRUST TILE
     ========================================================================== -->
  <template id="sensor_tile">
    <div class="tile span-4">
      <div class="row-between">
        <span class="lbl">{{title}}<span class="info">i<span class="tip">Reliability of this sensor feed (0&ndash;1).
              Combines timing, jitter, packet delivery and physiological plausibility: timing {{s_l}}, jitter {{s_j}},
              packets {{s_p}}, plausibility {{s_d}}.</span></span></span>
        <span class="pill {{p_cls}}">{{st_name}}</span>
      </div>
      <div style="margin-top:16px;">
        <div class="val-lg">{{trust_val}}</div>
        <div class="sub" style="margin-top:6px;">{{reading}}</div>
      </div>
      <div class="bar-bg">
        <div class="bar-fill" style="width:{{pct}}%;background:{{bar_col}};"></div>
      </div>
    </div>
  </template>


  <!-- ==========================================================================
     5. DETAILED BED VIEW
     ========================================================================== -->
  <template id="detail_view">
    <div class="bento">
      {{emergency_banner_html}}
      <div class="tile span-12" style="background:var(--card-2); border-color:rgba(96,165,250,0.22); padding:16px 20px;">
        <div class="row-between">
          <div>
            <div style="font-size:20px; font-weight:800; color:#fff;">{{patient_name}}</div>
            <div class="meta" style="margin-top:2px;">{{pid}} &middot; {{room}} &middot; {{diagnosis}} &middot; Admitted: {{admitted_ts}}</div>
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <span class="pill pill-blue">Synced with Bedside Node</span>
            <span class="pill {{pill_cls}}">{{label}}</span>
          </div>
        </div>
      </div>

      <div class="tile span-8">
        <div class="row-between">
          <span class="lbl">ECG &middot; Lead II<span class="info">i<span class="tip">Live electrocardiogram trace for
                this patient, synchronized from Bedside Jetson.</span></span></span>
          <span class="sub">{{pid}} &middot; {{room}}</span>
        </div>
        <div style="margin-top:14px;">{{ecg_svg}}</div>
      </div>

      <div class="tile span-4">
        <div class="lbl">Patient condition<span class="info">i<span class="tip">Rhythm assessment from the bedside AI,
              plus the estimated chance of arrhythmia.</span></span></div>
        <div class="val-md" style="color:{{rhythm_col}};margin-top:14px;">{{rhythm_txt}}</div>
        <div class="kv-list">
          <div class="kv"><span>Arrhythmia risk</span><span>{{arrhythmia_prob}}%</span></div>
          <div class="kv"><span>Alert route</span><span>{{alert_route}}</span></div>
        </div>
      </div>

      {{sensor_tiles_html}}

      <div class="tile span-8">
        <div class="row-between">
          <span class="lbl">Sensor reliability over time<span class="info">i<span class="tip">Dashed lines mark the
                nominal (0.70) and quarantine (0.45) thresholds.</span></span></span>
          <span class="legend">
            <span><i class="dot" style="background:#34d399"></i>ECG</span>
            <span><i class="dot" style="background:#60a5fa"></i>SpO2</span>
            <span><i class="dot" style="background:#fbbf24"></i>HR</span>
            <span><i class="dot" style="background:#f97316"></i>CO2</span>
            <span><i class="dot" style="background:#ec4899"></i>IBP</span>
            <span><i class="dot" style="background:#a855f7"></i>NIBP</span>
          </span>
        </div>
        <div style="margin-top:14px;">{{trust_chart_svg}}</div>
      </div>

      <div class="tile span-4">
        <div class="lbl">Alerts</div>
        <div class="log-list">{{log_rows_html}}</div>
      </div>
    </div>
  </template>


  <!-- ==========================================================================
     6. SIDEBAR
     ========================================================================== -->
  <template id="sidebar_header">
    <div class="lbl" style="margin-bottom:4px;">Nurse station</div>
    <div class="title" style="font-size:18px;">Central ICU Ward</div>
    <div
      style="background:#111720;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:10px 12px;margin:12px 0 14px 0;">
      <div class="row-between">
        <span style="font-size:12px;font-weight:700;color:#f8fafc;">{{station_id}}</span>
        <span class="pill {{role_cls}}">{{role_name}}</span>
      </div>
    </div>
  </template>

  <template id="sidebar_failover_banner">
    <div
      style="background:rgba(248,113,113,0.14);color:#fecaca;padding:10px 12px;border-radius:12px;font-size:12px;font-weight:700;margin-bottom:12px;">
      Primary station failed. Standby promoted to leader.
    </div>
  </template>

  <template id="sidebar_bed_row">
    <div style="background:#111720; border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:10px 12px; margin-bottom:8px;">
      <div class="row-between" style="align-items:flex-start; margin-bottom:3px;">
        <div>
          <div style="font-weight:700; color:#fff; font-size:13px; line-height:1.25;">{{patient_name}}</div>
          <div style="font-size:11px; color:#8a96a6; margin-top:2px;">
            <span style="color:#eef2f6; font-weight:600;">{{pid}}</span> &middot; {{room_label}}
          </div>
        </div>
        <span class="pill {{pill_cls}}" style="font-size:10px; padding:2px 7px;">{{st_lbl}}</span>
      </div>
      <div style="font-size:11px; color:#aab4c2; font-family:'IBM Plex Mono',monospace; margin:6px 0 8px 0; line-height:1.35;">
        HR {{hr_v}} &middot; SpO2 {{sp_v}}% &middot; CO2 {{co2_v}} &middot; BP {{bp_v}}
      </div>
      <a href="?bed={{pid}}&view=detail&dept={{dept}}" target="_self" style="display:block; text-align:center; padding:6px 10px; font-size:11px; font-weight:700; color:#60a5fa; background:rgba(96,165,250,0.1); border:1px solid rgba(96,165,250,0.28); border-radius:7px; text-decoration:none;">
        Open Bed Dashboard &rarr;
      </a>
    </div>
  </template>

  <template id="sidebar_unassigned_row">
    <div class="device-row">
      <div><strong>{{pid}}</strong><br><span style="font-size:11px;color:#8a96a6;">New bedside unit</span></div>
      <span class="pill pill-amber">Ready</span>
    </div>
  </template>

  <template id="sidebar_bedside_link">
    <div class="sec-label">Bedside monitor</div>
    <a href="http://localhost:8080" target="_blank"
      style="font-size:13px;color:#60a5fa;text-decoration:none;font-weight:600;">
      Open bedside view &rarr;
    </a>
  </template>


  <!-- ==========================================================================
     7. BED ADMISSION
     ========================================================================== -->
  <template id="admission_banner">
    <div
      style="background:#111720;border:1px solid rgba(96,165,250,0.35);border-radius:18px;padding:16px 20px;margin-bottom:18px;">
      <span style="font-size:16px;font-weight:700;color:#f8fafc;">Add a bed</span>
      <div style="font-size:13px;color:#8a96a6;margin-top:2px;">Detected bedside units ready to be assigned to a patient
        bed.</div>
    </div>
  </template>

  <template id="admission_empty">
    <div style="padding:14px 16px;background:#111720;border-radius:12px;font-size:13px;color:#8a96a6;margin:12px 0;">
      No new bedside units detected. Power one on and rescan.
    </div>
  </template>

</body>

</html>
